[project]
name = "ai-platform"
version = "0.1.0"
description = "Внутренняя AI-платформа Kerneu Group — Gateway, классификатор, роутер, db_query"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "sqlglot>=25.0",
    "openai>=1.40",
    "anthropic>=0.34",
    "google-genai>=0.3",
    "python-jose[cryptography]>=3.3",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.ruff]
line-length = 100

[tool.uv]
package = false
