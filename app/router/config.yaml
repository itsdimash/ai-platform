# Роутинг: task_type -> модель. Простой конфиг, без ML — легко менять
# без деплоя нового кода (можно вынести в БД позже, если понадобится
# правка без релиза вообще).

confidence_threshold: 0.7
fallback_model: gemini-flash  # безопасный дефолт при низкой уверенности

# ДОБАВЛЕНО: раньше max_tokens=2048 был жёстко зашит в коде (routers/chat.py
# и routers/chat_multimodal.py) и применялся ОДИНАКОВО ко всем задачам —
# и к короткому general_qa, и к генерации договора или презентации, которым
# 2048 токенов (~1500 слов) может не хватить и результат обрежется
# на середине. Теперь лимит настраивается здесь, по типу задачи.
default_max_tokens: 2048

# Логическое имя (то, что видно в API: ChatRequest.model, routing_rules ниже) ->
# провайдер и РЕАЛЬНЫЙ ID модели. Это единственное место, где живут ID моделей.
# Проверить, что ID доступны вашим ключам: `uv run python scripts/list_models.py`
# (скрипт сверяет этот блок со списком моделей провайдеров).
models:
  gpt-4o-mini: {provider: openai, id: gpt-4o-mini}
  gpt-4o: {provider: openai, id: gpt-4o}
  claude-haiku: {provider: anthropic, id: claude-haiku-4-5-20251001}
  claude-sonnet: {provider: anthropic, id: claude-sonnet-5}
  claude-opus: {provider: anthropic, id: claude-opus-5}
  gemini-flash: {provider: gemini, id: gemini-3.6-flash}
  gemini-pro: {provider: gemini, id: gemini-3.1-pro-preview}

# Модель генерации изображений (OpenAI Images API) и её таймаут в секундах.
image:
  provider: openai
  model: gpt-image-2
  timeout_s: 45

# Тип серверного web-search tool у Anthropic. В установленном SDK есть версии
# web_search_20250305 (текущая), web_search_20260209 и web_search_20260318.
anthropic_web_search_tool: web_search_20250305

routing_rules:
  translation:
    primary: gpt-4o-mini
    fallback: gemini-flash
    max_tokens: 2048

  summarization:
    primary: claude-sonnet
    fallback: gpt-4o-mini
    max_tokens: 2048

  rewriting:
    primary: gpt-4o-mini
    fallback: gemini-flash
    max_tokens: 2048

  contract_generation:
    primary: claude-opus
    fallback: claude-sonnet
    require_human_review: true
    max_tokens: 8000

  data_analysis:
    primary: gpt-4o
    fallback: claude-sonnet
    max_tokens: 4096

  db_query:
    primary: gemini-flash
    fallback: gpt-4o-mini
    max_tokens: 1500

  web_search:
    primary: gpt-4o
    fallback: claude-sonnet
    web_search: true
    max_tokens: 3072

  general_qa:
    primary: gemini-flash
    fallback: gpt-4o-mini
    max_tokens: 2048
