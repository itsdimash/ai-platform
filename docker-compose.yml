services:
  ai-platform:
    build: .
    env_file: .env
    ports:
      - "8001:8000"
    restart: unless-stopped
    depends_on:
      - ai-platform-db

  ai-platform-db:
    image: postgres:16
    environment:
      POSTGRES_USER: ai_platform
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ai_platform
    volumes:
      - ai_platform_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    restart: unless-stopped

volumes:
  ai_platform_data:
